<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1><img src="icons/toolbar-32.png" alt="" width="18" height="18">Hoot</h1>
    <label class="switch" title="Turn Hoot on or off">
      <input type="checkbox" data-key="enabled"><span></span>
    </label>
  </header>

  <main>
    <section>
      <h2>Layout</h2>
      <div class="modes" role="radiogroup" aria-label="Layout">
        <button data-mode="default" role="radio"><b>Default</b><small>Header, video and title</small></button>
        <button data-mode="fullframe" role="radio"><b>Full Frame</b><small>Just the video, as big as it fits</small></button>
      </div>
    </section>
    <div id="groups"></div>
  </main>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
